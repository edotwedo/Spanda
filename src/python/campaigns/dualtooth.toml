blast_template = """Every time you switch between Windows and Linux, the newly booted OS negotiates a fresh 128-bit link key (and for modern BLE 5.0 devices, a new Identity Resolving Key / `IRK`), which invalidates the pairing key stored in the other OS.

Instead of manual `psexec` registry hex dumping or broken scripts, I built **Dualtooth** (https://dualtooth.com) — a standalone offline Windows tool that syncs Classic LinkKeys, BLE LongTermKeys, and IRKs into BlueZ in 1 click, with automatic BitLocker USB export and `--undo` rollback."""
